# Prometheus scrape config. Service names follow the DNS contract in
# deploy/README.md so the same file works under docker compose and in the
# `platform` namespace (the Kubernetes overlay adds pod discovery).
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    platform: vmp

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Voice agent API: prometheus-client metrics at /metrics.
  - job_name: vmp-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8080"]
        labels:
          service: vmp-api

  # Metrics forwarded through the collector (OTLP -> prometheus exporter).
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
        labels:
          service: otel-collector

  # Ray head exposes cluster metrics on 8080 (dashboard agent) when running.
  - job_name: ray
    static_configs:
      - targets: ["ray-head:8080"]
        labels:
          service: ray
