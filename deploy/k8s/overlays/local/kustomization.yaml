# Local cluster overlay: k3d or kind.
#   k3d cluster create vmp -p "8080:80@loadbalancer"
#   kubectl apply -k deploy/k8s/overlays/local
#
# One replica of everything, small requests so the whole stack fits on a laptop,
# and no Ingress: reach the API with `kubectl port-forward svc/api 8080:8080`.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: platform

resources:
  - ../../base

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/instance: local

images:
  - name: ghcr.io/hyperscaleailabs/vmp-api
    newTag: dev

patches:
  - path: api-replicas-and-resources.yaml
  - path: hpa-small.yaml
  # A single API replica cannot satisfy minAvailable: 1 during a rolling update.
  - target:
      kind: PodDisruptionBudget
      name: api
    patch: |-
      $patch: delete
      apiVersion: policy/v1
      kind: PodDisruptionBudget
      metadata:
        name: api
        namespace: platform

configMapGenerator:
  - name: serving-config
    behavior: merge
    literals:
      - VMP_LOG_LEVEL=debug
